<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiverr Success</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .header img {
            width: 32px;
            height: 32px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #00b22d, #1dbf73);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .status-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
        }

        .status-value {
            font-size: 24px;
            font-weight: 700;
            color: #1dbf73;
        }

        .last-scrape {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }

        .stat-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00b22d, #1dbf73);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(29, 191, 115, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .instructions {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icons/icon48.png" alt="Logo">
        <h1>Fiverr Success</h1>
    </div>

    <div class="status-card">
        <div class="status-label">Last Tracked Query</div>
        <div class="status-value" id="lastQuery">-</div>
        <div class="last-scrape" id="lastTime">No data yet</div>
    </div>

    <div class="stats-grid">
        <div class="stat-item">
            <div class="stat-number" id="gigCount">0</div>
            <div class="stat-text">Gigs Tracked</div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="queryCount">0</div>
            <div class="stat-text">Searches</div>
        </div>
    </div>

    <button class="btn btn-primary" id="openDashboard">
        Open Dashboard
    </button>
    <button class="btn btn-secondary" id="clearData">
        Clear Stored Data
    </button>

    <div class="instructions">
        <strong>How to use:</strong><br>
        1. Search on Fiverr<br>
        2. Data is automatically captured<br>
        3. Open dashboard to view rankings
    </div>

    <script src="popup.js"></script>
</body>

</html>
